name: Update public mobility data
on:
  workflow_dispatch:
  schedule:
    - cron: "25 8 * * *"
  push:
    paths:
      - "scripts/update_market_data.py"
      - "scripts/update_solar_data.py"
      - ".github/workflows/update-market-data.yml"
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update MIMIT fuel data and verified history
        run: python scripts/update_market_data.py
      - name: Update PVGIS weekly or manually
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "7" ]; then
            python scripts/update_solar_data.py || true
          fi
      - name: Commit changed public data
        run: |
          git config user.name "Toscana Mobility Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/market-history.json data/solar.json
          git diff --cached --quiet || git commit -m "Update public mobility data"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v4
